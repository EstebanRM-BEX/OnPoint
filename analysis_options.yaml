# Análisis estático — WMS App Flutter
# Base: flutter_lints (nivel estándar Flutter)
# Plan: migrar a very_good_analysis tras completar Phase 3 (refactorización God Objects)
#
# Historial:
#   2026-06-22 — Habilitadas reglas F4-2 del plan de mejoras; eliminada supresión avoid_print

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # avoid_print: eliminado — todos los print() fueron migrados a debugPrint()
    depend_on_referenced_packages: ignore
    deprecated_member_use: ignore
    file_names: ignore
    library_private_types_in_public_api: ignore
    unnecessary_null_comparison: ignore

linter:
  rules:
    # ── Reglas habilitadas (F4-2 del plan de mejoras) ──────────────────────────
    avoid_print: true          # print() ejecuta en release y puede exponer datos
    close_sinks: true          # StreamController sin close() → memory leak
    cancel_subscriptions: true # StreamSubscription sin cancel() → memory leak

    # ── Reglas desactivadas temporalmente (quitar cuando Phase 3 esté completa) ─
    # use_build_context_synchronously: true  # 95 archivos aún tienen ignore_for_file
